name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build app
        run: make

      - name: Run tests
        run: make test

      - name: Create ZIP archive
        run: zip -r "PasteAsMarkdown-${GITHUB_REF_NAME}.zip" "Paste as Markdown.app"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PasteAsMarkdown-*.zip
          generate_release_notes: true
